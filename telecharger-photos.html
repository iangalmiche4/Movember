<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Téléchargement des Photos — Movember</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #fbbf24; }
    p { font-size: 0.95rem; color: #94a3b8; margin-bottom: 1.5rem; line-height: 1.5; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #e11d48;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.85rem 1.75rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }
    .btn:hover:not(:disabled) { background: #be123c; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .progress-box {
      margin-top: 1.5rem;
      background: #0f172a;
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid #334155;
      text-align: left;
      font-family: monospace;
      font-size: 0.85rem;
      max-height: 180px;
      overflow-y: auto;
      display: none;
    }
    .log-item { margin-bottom: 0.25rem; color: #cbd5e1; }
    .log-success { color: #4ade80; font-weight: bold; }
    .log-err { color: #f87171; }
  </style>
  <!-- Bibliothèques JSZip et FileSaver via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

  <div class="card">
    <div style="font-size: 3rem; margin-bottom: 1rem;">🧔📸</div>
    <h1>Télécharger toutes les photos</h1>
    <p>Récupère automatiquement toutes les photos du concours Movember avec les pseudos des participants dans une archive ZIP.</p>

    <button id="downloadBtn" class="btn" onclick="startDownload()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      <span>Télécharger l'archive ZIP (.zip)</span>
    </button>

    <div id="progressBox" class="progress-box"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://rvqebmyixdmfzzorypps.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2cWVibXlpeGRtZnp6b3J5cHBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjMyMjksImV4cCI6MjEwNzk5OTIyOX0.KPJ27inhnidVVG7igJBflUvUc1xMohUH-wkVScUBJgQ';

    function log(msg, type = '') {
      const box = document.getElementById('progressBox');
      box.style.display = 'block';
      const div = document.createElement('div');
      div.className = 'log-item' + (type ? ' log-' + type : '');
      div.textContent = msg;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function startDownload() {
      const btn = document.getElementById('downloadBtn');
      btn.disabled = true;
      btn.innerHTML = '⏳ Récupération en cours...';

      const box = document.getElementById('progressBox');
      box.innerHTML = '';
      log('Connexion à Supabase...');

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/contest_entries?select=pseudo,photo_url`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!res.ok) throw new Error(`Erreur Supabase: ${res.statusText}`);
        const entries = await res.json();

        if (!entries || entries.length === 0) {
          log('Aucune photo trouvée dans la base de données.', 'err');
          btn.disabled = false;
          btn.innerHTML = 'Télécharger l\'archive ZIP (.zip)';
          return;
        }

        log(`${entries.length} photo(s) trouvée(s). Téléchargement en cours...`);
        const zip = new JSZip();

        let count = 0;
        for (let i = 0; i < entries.length; i++) {
          const entry = entries[i];
          if (!entry.photo_url) continue;

          const pseudo = (entry.pseudo || 'candidat').replace(/[^a-zA-Z0-9_\-]/g, '_');
          const originalName = entry.photo_url.split('/').pop().split('?')[0];
          const filename = `${pseudo}_${originalName}`;

          log(`[${i + 1}/${entries.length}] Téléchargement de ${filename}...`);

          try {
            const imgRes = await fetch(entry.photo_url);
            const blob = await imgRes.blob();
            zip.file(filename, blob);
            count++;
          } catch (e) {
            log(`❌ Erreur sur ${filename}`, 'err');
          }
        }

        log('Génération du fichier ZIP...', 'log-item');
        const zipContent = await zip.generateAsync({ type: 'blob' });
        
        const dateStr = new Date().toISOString().slice(0, 10);
        saveAs(zipContent, `Movember_Photos_${dateStr}.zip`);

        log(`✅ Terminé ! ${count} photo(s) enregistrée(s) dans le ZIP.`, 'success');
        btn.innerHTML = '✅ Téléchargement terminé !';

      } catch (err) {
        log(`Erreur : ${err.message}`, 'err');
        btn.disabled = false;
        btn.innerHTML = 'Réessayer';
      }
    }
  </script>
</body>
</html>
