<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Saint Loup Movember</title>
  <meta name="description" content="Connectez-vous ou créez votre compte pour participer au concours de la moustache Movember Saint Loup.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    /* Layout pleine page centré */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      gap: 0;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    /* Branding */
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      text-align: center;
    }
    .login-brand-icon {
      width: 48px;
      height: 48px;
      color: var(--color-accent-cyan);
    }
    .login-brand-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--color-text-primary);
      letter-spacing: -0.02em;
    }
    .login-brand-name span {
      color: var(--color-accent-cyan);
    }
    .login-brand-tagline {
      font-size: 0.875rem;
      color: var(--color-text-muted);
    }

    /* Carte principale */
    .login-card {
      background: var(--color-bg-surface);
      border: var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    /* Tabs */
    .login-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .login-tab {
      flex: 1;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-text-muted);
      padding: 1rem;
      position: relative;
      transition: color var(--transition-fast);
    }
    .login-tab::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--color-accent-cyan);
      transition: width var(--transition-fast);
    }
    .login-tab.active {
      color: var(--color-accent-cyan);
    }
    .login-tab.active::after {
      width: 100%;
    }

    /* Formulaires */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      padding: 1.75rem;
    }
    .login-form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: 0.35rem;
    }
    .login-form-input {
      width: 100%;
      background: var(--color-bg-input);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      font-size: 0.925rem;
      color: var(--color-text-primary);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .login-form-input:focus {
      outline: none;
      border-color: var(--color-accent-cyan);
      box-shadow: 0 0 0 3px rgba(0,188,212,0.12);
    }
    .login-form-input::placeholder { color: var(--color-text-dimmed); }

    .login-error {
      display: none;
      font-size: 0.8125rem;
      color: #f87171;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: var(--radius-sm);
      padding: 0.55rem 0.8rem;
    }
    .login-submit-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem;
      font-size: 0.975rem;
      font-weight: 700;
      border-radius: var(--radius-full);
      background: var(--color-accent-gradient);
      color: #0b0f14;
      border: none;
      cursor: pointer;
      margin-top: 0.25rem;
      transition: filter var(--transition-fast), transform var(--transition-fast);
    }
    .login-submit-btn:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .login-submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .login-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(11,15,20,0.3);
      border-top-color: #0b0f14;
      border-radius: 50%;
      animation: loginSpin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes loginSpin { to { transform: rotate(360deg); } }

    .login-switch-text {
      text-align: center;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      padding: 0 1.75rem 1.5rem;
      margin-top: -0.5rem;
    }
    .login-switch-text a {
      color: var(--color-accent-cyan);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Notice mode démo */
    .login-demo-notice {
      text-align: center;
      font-size: 0.775rem;
      color: var(--color-text-dimmed);
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius-sm);
      padding: 0.6rem 1rem;
    }

    /* Mobile : zones tactiles >= 44-48px, marges réduites */
    @media (max-width: 768px) {
      .login-tab { min-height: 48px; }
      .login-form-input {
        min-height: 48px;
        font-size: 1rem; /* évite le zoom automatique d'iOS au focus */
      }
      .login-submit-btn { min-height: 48px; }
      .login-switch-text a { display: inline-block; padding-block: 0.6rem; }
    }

    @media (max-width: 480px) {
      body { padding: 1rem; }
      .login-wrapper { gap: 1.25rem; }
      .login-brand-name { font-size: 1.2rem; }
      .login-form { padding: 1.25rem 1rem; }
      .login-switch-text { padding: 0 1rem 1.25rem; }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">

    <!-- Logo / Branding -->
    <div class="login-brand">
      <svg class="login-brand-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 14.5c-.8 0-1.5-.2-2.2-.6-1.5-.9-2.7-2.3-4.3-2.9-1.3-.5-2.8-.4-4 .4-.3.2-.5.5-.5.9 0 .8.6 1.5 1.4 1.7 1.8.4 3.7 1.4 5.2 2.6 1.4 1.1 2.8 2.2 4.4 2.2s3-.1 4.4-2.2c1.5-1.2 3.4-2.2 5.2-2.6.8-.2 1.4-.9 1.4-1.7 0-.4-.2-.7-.5-.9-1.2-.8-2.7-.9-4-.4-1.6.6-2.8 2-4.3 2.9-.7.4-1.4.6-2.2.6z"/>
      </svg>
      <p class="login-brand-name">Saint Loup <span>Movember</span></p>
      <p class="login-brand-tagline">Connectez-vous pour accéder à l'événement solidaire</p>
    </div>

    <!-- Carte Login -->
    <div class="login-card">
      <div class="login-tabs">
        <button class="login-tab active" id="tabSignin">Se connecter</button>
        <button class="login-tab" id="tabSignup">S'inscrire</button>
      </div>

      <!-- Formulaire Connexion -->
      <form class="login-form" id="signinForm" novalidate>
        <div>
          <label class="login-form-label" for="authEmailInput">Adresse email</label>
          <input class="login-form-input" type="email" id="authEmailInput" placeholder="vous@email.com" autocomplete="email" required>
        </div>
        <div>
          <label class="login-form-label" for="authPasswordInput">Mot de passe</label>
          <input class="login-form-input" type="password" id="authPasswordInput" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div class="login-error" id="signinError" role="alert"></div>
        <button type="submit" class="login-submit-btn" id="signinSubmit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Se connecter
        </button>
      </form>
      <p class="login-switch-text" id="switchSigninText">Pas encore de compte ? <a id="switchToSignup">S'inscrire</a></p>

      <!-- Formulaire Inscription -->
      <form class="login-form" id="signupForm" style="display:none;" novalidate>
        <div>
          <label class="login-form-label" for="signupPseudoInput">Pseudo (affiché publiquement)</label>
          <input class="login-form-input" type="text" id="signupPseudoInput" placeholder="Ex: MoustacheMan" autocomplete="nickname" required>
        </div>
        <div>
          <label class="login-form-label" for="signupEmailInput">Adresse email</label>
          <input class="login-form-input" type="email" id="signupEmailInput" placeholder="vous@email.com" autocomplete="email" required>
        </div>
        <div>
          <label class="login-form-label" for="signupPasswordInput">Mot de passe (min. 6 caractères)</label>
          <input class="login-form-input" type="password" id="signupPasswordInput" placeholder="••••••••" autocomplete="new-password" required>
        </div>
        <div class="login-error" id="signupError" role="alert"></div>
        <button type="submit" class="login-submit-btn" id="signupSubmit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          Créer mon compte
        </button>
      </form>
      <p class="login-switch-text" id="switchSignupText" style="display:none;">Déjà inscrit ? <a id="switchToSignin">Se connecter</a></p>
    </div>

    <p class="login-demo-notice" id="demoNotice" style="display:none;">
      ⚠️ Supabase non configuré — mode démo local actif. Connectez vos clés dans <code>js/config.js</code>.
    </p>

  </div>

  <!-- Toast notifications -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
